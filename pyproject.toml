[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lutron-dmx"
dynamic = ["version"]
description = "Local control of Lutron RadioRA 2 / RA3 lighting from a web GUI and DMX / Art-Net / sACN input"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["lutron", "radiora2", "dmx", "art-net", "sacn", "lighting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pyserial>=3.5",
    "pylutron-caseta>=0.20",
    "cryptography>=41",
    "orjson>=3.9",
    "zeroconf>=0.130",
    "ifaddr>=0.2",
]

[project.urls]
Homepage = "https://github.com/m3636/Lutron-to-DMX-Bridge"
Issues = "https://github.com/m3636/Lutron-to-DMX-Bridge/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
lutron-dmx = "lutron_dmx.__main__:main"
lutron-dmx-app = "lutron_dmx.launcher:main"

[tool.setuptools.dynamic]
version = {attr = "lutron_dmx.__version__"}

[tool.setuptools.packages.find]
include = ["lutron_dmx*"]

[tool.setuptools.package-data]
lutron_dmx = ["web/static/*", "drivers/sample_data/*", "assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
