name: New release

# Actions tab -> "New release" -> Run workflow. Bumps __version__, tests, commits to main, tags vX.Y.Z,
# then starts the CI workflow on the tag, which builds the macOS and Windows apps and publishes the
# GitHub Release (see the "release" job in ci.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead, e.g. 1.0.0 (leave empty to use the choice above)
        type: string
        required: false
      notes:
        description: Optional text for the top of the release notes (the merged PRs are listed below it)
        type: string
        required: false
      dry_run:
        description: Dry run - bump, test and preview the notes, but push and publish nothing
        type: boolean
        default: false

# Two releases at once would race for the same version.
concurrency:
  group: new-release
  cancel-in-progress: false

permissions:
  contents: write   # push the version commit and the tag
  actions: write    # start the CI workflow on the tag

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Only release from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on $DEFAULT_BRANCH (\"Use workflow from\"), not on $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Optional RELEASE_TOKEN secret (a personal access token with repo scope) lets the push get
          # past branch protection on main. Without it the built-in token is used.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # The release is built from this exact commit, so CI must already be green on it.
      - name: CI has passed on this commit
        run: |
          PASSED=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq length)
          if [ "$PASSED" = "0" ]; then
            echo "::error::No successful CI run on ${GITHUB_SHA::7} yet. Wait for CI on the latest commit of $GITHUB_REF_NAME to finish (and fix it if it failed), then run this again."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          read_version() { sed -n 's/^__version__ = "\(.*\)"/\1/p' lutron_dmx/__init__.py; }
          CURRENT=$(read_version)
          WANT="${VERSION_INPUT//[[:space:]]/}"
          WANT="${WANT#v}"
          if [ -n "$WANT" ] && [ "$WANT" = "$CURRENT" ]; then
            # Typically a release whose tag was deleted after a failed build: tag the code as it is.
            echo "Version $CURRENT is already in the code; tagging it without a new commit."
          else
            python tools/bump_version.py "${WANT:-$BUMP}"
          fi
          NEW=$(read_version)
          TAG="v$NEW"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a newer version."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Pick a newer version."
            exit 1
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run the tests on the bumped code
        run: |
          python -m pip install -e ".[dev]"
          xvfb-run -a python -m pytest -q

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release $TAG"
          fi
          git tag -a "$TAG" -m "Lutron DMX ${TAG#v}"
          git log --oneline -3
          git diff --stat HEAD~1 HEAD || true

      - name: Preview the release notes (dry run)
        if: inputs.dry_run
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## Dry run for $TAG"
            echo "Tests passed. Nothing was pushed or published. The release notes would be:"
            echo
            if [ -n "$EXTRA_NOTES" ]; then printf '%s\n\n' "$EXTRA_NOTES"; fi
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Atomic: either both the version commit and the tag land, or neither does. It also fails if main
      # moved since this run started, so a release can never be built from an unreviewed commit.
      - name: Push the commit and the tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"

      # Pushes made with the built-in token do not start other workflows, but workflow_dispatch is
      # exempt, so CI is started explicitly on the tag (github.ref is then refs/tags/vX.Y.Z, which is what
      # the release job checks).
      - name: Build and publish the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh workflow run ci.yml --ref "$TAG" -f release_notes="$NOTES" || {
            echo "::error::$TAG is pushed but CI could not be started. Start it by hand: Actions > CI > Run workflow > Use workflow from: Tag $TAG."
            exit 1
          }
          {
            echo "## $TAG tagged"
            echo "Build and publish: https://github.com/$GH_REPO/actions/workflows/ci.yml"
            echo "The release appears at https://github.com/$GH_REPO/releases/tag/$TAG when the macOS and Windows builds finish."
          } | tee -a "$GITHUB_STEP_SUMMARY"
